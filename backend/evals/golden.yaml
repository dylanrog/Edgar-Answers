# Golden retrieval set for the Phase 2 recall@10 exit criterion (design §8).
# Every accession and sid below was read from the ingested AAPL corpus and
# validated with `python -m evals verify`.
#
# q006-q010 were rewritten once, after the first eval run: their original
# gold sentences were either boilerplate that repeats near-verbatim across
# multiple ingested 10-Ks (crowding the correct filing's chunk out of the
# fused ranking) or buried in a large chunk dominated by an unrelated topic.
# The replacements point at filing-year-specific numeric facts instead and
# were confirmed to actually retrieve before being committed here — gold_sids
# were never adjusted to match what a given question's own retrieval run
# returned.
#
# Every gold_sids value below was re-anchored on 2026-08-28 by
# `python -m evals repin --apply`, after `python -m pipeline reprocess`
# rebuilt the corpus so financial tables index one sentence per row instead
# of one flattened sentence per table (spec 2026-08-12-tables-first-class).
# A sid that used to point at a whole flattened table now points at every
# row of that table (q006, q007, q009 carry several sids for this reason).
# gold_sid_hit_rate from before this re-pin is not comparable to any run
# after it: the sids it scores against were redefined by this change.

