# Tutorial script (guided tour, spec 2026-11-09 §9). Golden-set format (see
# golden.yaml). One chain: tutorial-1 is the opening question, tutorial-2 is the
# follow-up asked in the SAME conversation (`after: tutorial-1`); a run passes
# only if both turns pass. Entries sharing a `group` are one comparison
# question, one entry per company. NVDA entries need a cited table cell, and
# `gold_cells` pins its column: cell 2 is the year-of-interest figure on both
# gold rows (FY25 sid 2768: 115,186; FY24 sid 2777: 47,525), cells 6 and 10
# are the prior years.
# An entry may list `alternatives`: other pins (accession, gold_sids,
# expected_values, optional gold_cells/requires_cell) that satisfy it instead of
# its own pin, judged by the same rules; a citation inside an alternative's gold
# sids is not stray. tutorial-2-msft uses this for a restatement: Microsoft's
# FY2025 and FY2026 10-Ks report fiscal 2024 Microsoft Cloud revenue as $137.7B
# (restated) against $137.4B as originally reported in the FY2024 10-K. Citing a
# later filing's restated figure for the same fiscal year is a correct answer for
# the period asked, not period confusion -- but only with the restated figure
# ($137.7B) stated, so a later filing's FY2025 or FY2026 figure still fails.
# (Seen 1 in 20 live runs: the follow-up cited the FY2026 10-K, sid 2907.)
# Vetted with `python -m evals examples` (10 runs); check pins with
# `python -m evals verify --examples`. Must match frontend/lib/tutorial.json;
# tests/test_examples.py enforces that.
#
# Retired examples (the earlier menu of independent questions):
# - Apple R&D fiscal 2025, Meta total liabilities 2025, Apple vs Microsoft R&D
#   comparison, and Apple Europe net sales: replaced by the scripted conversation.
# - "Microsoft's Intelligent Cloud revenue" fails turn 2 on every run: the model
#   cites Microsoft Cloud revenue ($137.4B) as Intelligent Cloud (verified but
#   wrong), and FY2024 Intelligent Cloud was restated ($105,362M as originally
#   reported, $87,464M restated). Hence turn 1 asks about Microsoft Cloud.
#
# Vetting result: 2026-11-10, full local corpus, `python -m evals examples --runs 10 --verbose` -> 10/10, identical citations every run
#   (NVDA FY25 sid 2768 cell 2; MSFT FY25 sid 2869; NVDA FY24 sid 2777 cell 2; MSFT FY24 sid 3161). With the earlier
#   probe (5/5) and first run (10/10): 25/25 two-turn conversations correct.

- id: tutorial-1-nvda
  group: tutorial-1
  question: Compare NVIDIA's Data Center revenue in fiscal 2025 with Microsoft's Cloud revenue in fiscal 2025.
  ticker: NVDA
  accession: "0001045810-25-000023"
  section: item15
  gold_sids: [2768]
  requires_cell: true
  gold_cells: [2]
  expected_values: [["115,186", "115.2 billion", "115.186 billion", "115.2"]]
- id: tutorial-1-msft
  group: tutorial-1
  question: Compare NVIDIA's Data Center revenue in fiscal 2025 with Microsoft's Cloud revenue in fiscal 2025.
  ticker: MSFT
  accession: "0000950170-25-100235"
  section: item7
  gold_sids: [1138, 2869]
  expected_values: [["168.9 billion", "168.9"]]
- id: tutorial-2-nvda
  group: tutorial-2
  after: tutorial-1
  question: What about 24?
  ticker: NVDA
  accession: "0001045810-24-000029"
  section: item15
  gold_sids: [2777]
  requires_cell: true
  gold_cells: [2]
  expected_values: [["47,525", "47.5 billion", "47.525 billion", "47.5"]]
- id: tutorial-2-msft
  group: tutorial-2
  after: tutorial-1
  question: What about 24?
  ticker: MSFT
  accession: "0000950170-24-087843"
  section: item7
  gold_sids: [1317, 3161]
  expected_values: [["137.4 billion", "137.4"]]
  alternatives:
    # FY2026 10-K: "...was $ 214.4 billion, $ 168.9 billion, and $ 137.7 billion
    # in fiscal years 2026, 2025, and 2024, respectively."
    - accession: "0001193125-26-323660"
      gold_sids: [2907]
      expected_values: [["137.7 billion", "137.7"]]
    # FY2025 10-K: "...was $ 168.9 billion, $ 137.7 billion, and $ 111.6 billion
    # in fiscal years 2025, 2024, and 2023, respectively."
    - accession: "0000950170-25-100235"
      gold_sids: [2869]
      expected_values: [["137.7 billion", "137.7"]]
