# Tutorial script (guided tour, spec 2026-11-09 §9). Golden-set format (see
# golden.yaml). One chain: tutorial-1 is the opening question, tutorial-2 is the
# follow-up asked in the SAME conversation (`after: tutorial-1`); a run passes
# only if both turns pass. Entries sharing a `group` are one comparison
# question, one entry per company. NVDA entries need a cited table cell, and
# `gold_cells` pins its column: cell 2 is the year-of-interest figure on both
# gold rows (FY25 sid 2768: 115,186; FY24 sid 2777: 47,525), cells 6 and 10
# are the prior years.
# An entry may list `alternatives`: other pins (accession, gold_sids,
# expected_values, optional gold_cells/requires_cell) that satisfy it instead of
# its own pin, judged by the same rules; a verified citation is not stray only
# when it comes from the filing of a pin (own or alternative) that passes.
# tutorial-2-msft uses this for a restatement: Microsoft's FY2025 and FY2026
# 10-Ks report fiscal 2024 Microsoft Cloud revenue as $137.7B (restated) against
# $137.4B as originally reported in the FY2024 10-K. Citing a later filing's
# restated figure for the same fiscal year is a correct answer for
# the period asked, not period confusion -- but only with the restated figure
# ($137.7B) stated, so a later filing's FY2025 or FY2026 figure still fails.
# (Seen 1 in 20 live runs: the follow-up cited the FY2026 10-K, sid 2907.)
# `wrong_values` lists the asked metric's figures for OTHER periods. Because any
# verified quote from a passing pin's filing is accepted, the judge relies on
# those figures appearing only on gold rows, where gold_cells catches a wrong
# year. `python -m evals verify --examples` checks that assumption: no sentence
# outside a pin's gold sids, in that pin's filing (alternatives' filings too),
# states any of the entry's wrong_values as a whole figure. tutorial-2-msft omits
# 137.7: an alternative accepts it.
# Vetted with `python -m evals examples` (10 runs); check pins with
# `python -m evals verify --examples`. Must match frontend/lib/tutorial.json;
# tests/test_examples.py enforces that.
#
# Retired examples (the earlier menu of independent questions):
# - Apple R&D fiscal 2025, Meta total liabilities 2025, Apple vs Microsoft R&D
#   comparison, and Apple Europe net sales: replaced by the scripted conversation.
# - "Microsoft's Intelligent Cloud revenue" fails turn 2 on every run: the model
#   cites Microsoft Cloud revenue ($137.4B) as Intelligent Cloud (verified but
#   wrong), and FY2024 Intelligent Cloud was restated ($105,362M as originally
#   reported, $87,464M restated). Hence turn 1 asks about Microsoft Cloud.
#
# Vetting result (final, 2026-11-11 at 2c37f52, full local corpus, FRESH planner stats after
#   ANALYZE): `python -m evals examples --runs 30 --verbose` -> 30/30, then --runs 50 -> 49/50
#   (79/80 total; turn 2 80/80; every core figure from its pinned row and cell 80/80; the one
#   failure was an optional extra claim about Compute/Networking that the model misquoted,
#   shown to the visitor as "unverified" by design). Both turns narrowed by
#   per-company period detection (turn 1: NVDA + MSFT FY2025 10-Ks; turn 2: the FY2024 10-Ks);
#   own pins every run, no alternative needed. History: 55/55 earlier under STALE stats (a
#   container crash had reset them, so the planner chose different plans); under fresh stats
#   before period detection was fixed, 1-2/20 follow-ups cited a later 10-K's restated $137.7B,
#   and 2/20 first turns highlighted a whole table row. Re-run after any Postgres restart only
#   once `ANALYZE` has run.

