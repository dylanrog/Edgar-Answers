[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-answers-backend"
version = "0.1.0"
# The deploy runtime, not a support range: this is an application with one
# container, so local, CI, and the Phase 5 image all run 3.13. Raising the
# floor is what makes that a constraint instead of a convention.
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pysbd>=0.3.4",
    "psycopg[binary]>=3.1",
    "tiktoken>=0.7",
    "fastembed>=0.3",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic==0.120.2",
    # Entry points load backend/.env so secrets stay in this project's
    # processes instead of the machine-wide environment (see pipeline/env.py).
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# ruff is pinned exactly: it ships new rules in minor releases and enables some
# by default, so an unpinned range makes CI fail on code that lints clean
# locally. Bump this deliberately, then run `ruff check .` before committing.
dev = ["pytest>=8.0", "ruff==0.16.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Selected explicitly rather than inheriting ruff's defaults, which changed in
# 0.16 and silently turned this file's lint contract into "whatever ruff ships".
[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "DTZ",  # naive datetimes — filings are dated, so tz correctness matters
    "BLE",  # blind except
    "PLW",  # pylint warnings
]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` in a parameter default is the FastAPI dependency-injection idiom,
# not the mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: requires a running Postgres; set TEST_DATABASE_URL to enable",
    "slow: downloads the embedding model; set RUN_SLOW_TESTS=1 to enable",
]
