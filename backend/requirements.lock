# Exact runtime dependency versions for the API image (backend/Dockerfile).
# These are the versions the backend suite passed on, and the fastembed /
# onnxruntime that embedded the stored corpus -- the query embedder must stay
# compatible with those vectors, so an unpinned rebuild is not safe.
# hf-xet is the one Linux-only package here (huggingface-hub needs it there,
# the Windows dev machine has none); it is pinned to what the image resolved.
# uvloop is deliberately absent: the suite never ran on it, and uvicorn falls
# back to asyncio without it.
#
# To bump a version: edit it here, rebuild, and run the suite inside the image
# (from the repo root, Git Bash, dev Postgres up; the deselected test needs git):
#   docker build -t edgar-api backend
#   MSYS_NO_PATHCONV=1 docker run --rm --user root \
#     -e TEST_DATABASE_URL=postgresql://user:password@host.docker.internal:5432/edgar_answers_test \
#     -v "$PWD/backend/tests:/app/tests" -v "$PWD/backend/evals:/app/evals" \
#     -v "$PWD/backend/migrations:/app/migrations" edgar-api sh -c "pip install -q pytest && \
#     python -m pytest -q -p no:cacheprovider --deselect tests/test_evals.py::test_append_results_writes_json_line"
